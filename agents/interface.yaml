interface:
  display_name: "SSH Remote Control"
  short_description: "Alias-first SSH, diagnosis, collaborators, remote HTTPS"
  default_prompt: "Use $ssh-remote-control to resolve the alias, then operate via native ssh/rsync."
compatibility:
  canonical_format: "agent-skills"
  adapter_targets: [openai, claude, generic]
  activation:
    mode: always
  execution:
    context: fork
    shell: powershell
  trust:
    source_tier: local
    remote_inline_execution: allow
    remote_metadata_policy: "Skill-owned remote commands on a resolved alias only. Never log passwords or private keys."
  degradation:
    openai: "Fall back to ~/.ssh/config + native ssh BatchMode."
    claude: "Fall back to ~/.ssh/config + native ssh BatchMode."
    generic: "Fall back to ~/.ssh/config + native ssh. Do not invent aliases."
